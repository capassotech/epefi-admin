<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Logo sobre fondo oscuro: se ve bien en pestañas claras y oscuras -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="180x180" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EPEFI - Administración</title>
    <!-- Aplica el tema guardado antes del primer pintado, para que no parpadee en claro -->
    <script>
      try {
        if (localStorage.getItem("epefi-admin-theme") === "dark") document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
